<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#791f2d"><title>戦国めもりーRPG ― 桜舞う天下統一の旅</title><link rel="stylesheet" href="style.css"><script src="data.js" defer></script><script src="engine.js" defer></script><script src="audio.js" defer></script><script src="game.js" defer></script></head><body>
<div class="scene" aria-hidden="true"></div><div id="petals" aria-hidden="true"></div>
<header class="topbar"><button class="brand" data-go="title">戦国めもりー <small>RPG</small></button><div class="top-tools"><span class="point-pill"><span aria-hidden="true">◆</span> <b id="points">0</b><small>ポイント</small></span><button id="audio-toggle" class="icon-button" aria-label="音の設定" aria-expanded="false">音</button><button id="help" class="icon-button" aria-label="遊び方">？</button></div></header>
<div id="audio-panel" class="audio-panel parchment" hidden><label for="volume">音量 <output id="volume-value">35%</output></label><input id="volume" type="range" min="0" max="100" value="35"><button id="mute" class="secondary">音をオンにする</button><small>BGM・効果音はオリジナルの合成音です。<br>音はボタンを押したあとに始まります。</small></div>
<nav class="nav" aria-label="メインメニュー"><button data-go="stages">冒険マップ</button><button data-go="collection">家紋図鑑</button><button data-go="castle">お城の成長</button></nav>
<main id="app"></main><div id="announcement" class="sr-only" role="status" aria-live="polite"></div><div id="save-status" role="status"></div>
<footer>絵から出会い、知ってつながる。五人の武将と、天下統一の旅へ。<br><small>キャラクター・建物は創作表現です。家紋の未検証画像は「仮画像」と表示しています。</small></footer>
<dialog id="modal" aria-labelledby="dialog-title"><button id="close-modal" class="close" aria-label="閉じる">×</button><div id="modal-content"></div></dialog>
</body></html>
